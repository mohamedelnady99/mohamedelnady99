<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0e4429"/>
      <stop offset="0.5" stop-color="#26a641"/>
      <stop offset="1" stop-color="#39d353"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="300" rx="14" fill="#0d1117"/>
  <text x="32" y="40" fill="#e6edf3" font-size="18" font-weight="700">My journey</text>
  <text x="32" y="60" fill="#7d8590" font-size="12">From front-end foundations to AI solutions</text>

  <!-- track -->
  <line x1="70" y1="160" x2="890" y2="160" stroke="#21262d" stroke-width="6" stroke-linecap="round"/>
  <line x1="70" y1="160" x2="890" y2="160" stroke="url(#line)" stroke-width="6" stroke-linecap="round" stroke-dasharray="820" stroke-dashoffset="820">
    <animate attributeName="stroke-dashoffset" from="820" to="0" dur="2.4s" fill="freeze"/>
  </line>

  <!-- 1 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>
    <circle cx="70" cy="160" r="7" fill="#0e4429" stroke="#26a641" stroke-width="2"/>
    <text x="70" y="120" fill="#39d353" font-size="12" font-weight="700" text-anchor="middle">2022</text>
    <text x="70" y="137" fill="#e6edf3" font-size="12" text-anchor="middle">Joined GitHub</text>
    <text x="70" y="196" fill="#7d8590" font-size="11" text-anchor="middle">First JS projects</text>
  </g>

  <!-- 2 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.4s" fill="freeze"/>
    <circle cx="206" cy="160" r="9" fill="#006d32"/>
    <text x="206" y="196" fill="#39d353" font-size="12" font-weight="700" text-anchor="middle">ITI</text>
    <text x="206" y="213" fill="#e6edf3" font-size="12" text-anchor="middle">Intensive training</text>
    <text x="206" y="229" fill="#7d8590" font-size="11" text-anchor="middle">React · JS · CS basics</text>
  </g>

  <!-- 3 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
    <circle cx="343" cy="160" r="11" fill="#006d32" stroke="#26a641" stroke-width="2"/>
    <text x="343" y="112" fill="#39d353" font-size="12" font-weight="700" text-anchor="middle">May 2024</text>
    <text x="343" y="129" fill="#e6edf3" font-size="12" text-anchor="middle">Tech Village</text>
    <text x="343" y="145" fill="#7d8590" font-size="11" text-anchor="middle">Front-End · React Native</text>
  </g>

  <!-- 4 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.25s" dur="0.4s" fill="freeze"/>
    <circle cx="480" cy="160" r="13" fill="#26a641"/>
    <text x="480" y="196" fill="#39d353" font-size="12" font-weight="700" text-anchor="middle">2025</text>
    <text x="480" y="213" fill="#e6edf3" font-size="12" text-anchor="middle">Odoo ERP</text>
    <text x="480" y="229" fill="#7d8590" font-size="11" text-anchor="middle">Accounting · Sales · HR</text>
  </g>

  <!-- 5 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.4s" fill="freeze"/>
    <circle cx="617" cy="160" r="15" fill="#26a641" stroke="#39d353" stroke-width="2"/>
    <text x="617" y="108" fill="#39d353" font-size="12" font-weight="700" text-anchor="middle">Apr 2026</text>
    <text x="617" y="125" fill="#e6edf3" font-size="12" text-anchor="middle">Divlix</text>
    <text x="617" y="141" fill="#7d8590" font-size="11" text-anchor="middle">Next.js 15 · AR/EN</text>
  </g>

  <!-- 6 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.95s" dur="0.4s" fill="freeze"/>
    <circle cx="754" cy="160" r="17" fill="#39d353"/>
    <text x="754" y="200" fill="#39d353" font-size="12" font-weight="700" text-anchor="middle">2026</text>
    <text x="754" y="217" fill="#e6edf3" font-size="12" text-anchor="middle">Full-stack platforms</text>
    <text x="754" y="233" fill="#7d8590" font-size="11" text-anchor="middle">Maskan · TIJORA · Mahabba</text>
  </g>

  <!-- 7: now -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.4s" fill="freeze"/>
    <circle cx="890" cy="160" r="20" fill="#39d353" opacity="0.35">
      <animate attributeName="r" values="20;30;20" dur="2s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0;0.35" dur="2s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="160" r="20" fill="#39d353" filter="url(#glow)"/>
    <text x="890" y="165" fill="#0d1117" font-size="11" font-weight="800" text-anchor="middle">NOW</text>
    <text x="890" y="104" fill="#39d353" font-size="12" font-weight="700" text-anchor="end">AI Solutions</text>
    <text x="890" y="121" fill="#e6edf3" font-size="12" text-anchor="end">Agents · RAG · Python</text>
  </g>
</svg>
